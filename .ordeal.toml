# acceptance criteria for a task in this repo — the oracle decides "done"
[[criterion]]
name = "py-compiles"
run  = "python3 -m py_compile $(git ls-files '*.py')"
[[criterion]]
name = "statute"
run  = "statute check"
[[criterion]]
name = "soundness-policy"
run  = "specforge run specforge/policy_dsl_soundness.py 100"
[[criterion]]
name = "soundness-range"
run  = "specforge run specforge/zk_range_soundness.py 12"
[[criterion]]
name = "soundness-membership"
run  = "specforge run specforge/or_proof_soundness.py 12"
[[criterion]]
name = "soundness-bulletproof"
run  = "specforge run specforge/bulletproof_soundness.py 8"
[[criterion]]
name = "ec-group-laws"
run  = "specforge run specforge/ec_group_laws.py 40"
