name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch qedra (the ZK core + secret rules this builds on)
        run: git clone --depth 1 https://github.com/ss1738/agent-guardrail "$HOME/agent-guardrail"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: python -m pip install --upgrade pip cryptography

      - name: Install Coq (coqc)
        run: sudo apt-get update && sudo apt-get install -y coq

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: onchain
        run: forge install foundry-rs/forge-std

      - name: Run the full verification suite
        run: ./verify.sh

      # Externally reproduce the differential soundness check (previously only run
      # on the author's Mini cluster). Two independent verifiers (Python + zkcore)
      # must agree on every proof; all three provers exercised; tampering rejected.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: GMP (for the zkcore-gmp backend)
        run: sudo apt-get install -y libgmp-dev m4
      - name: Build native ZK backends
        run: |
          cargo build --release --manifest-path rust/zkcore/Cargo.toml
          cargo build --release --manifest-path rust/zkcore-gmp/Cargo.toml
      - name: Differential fuzz (soundness across backends)
        run: |
          export QEDRA_PATH="$HOME/agent-guardrail"
          export PCAI_RUST="$GITHUB_WORKSPACE/rust"
          python3 fuzz/differential_fuzz.py 80
